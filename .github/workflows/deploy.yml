name: Build, Push and Deploy to Render

on:
  push:
    branches:
      - main

env:
  APP_NAME: personalfinancetracker
  IMAGE_TAG: latest
  WORKING_DIRECTORY: ./backend/FinanceTracker

jobs:
  tests:
    name: Run Tests
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Execute unit tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: mvn test

  build_and_push_docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build application package
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ env.WORKING_DIRECTORY }}

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build_and_push_docker

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -e

          echo "Triggering deployment on Render..."

          http_code=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"clear"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")

          echo "HTTP status: $http_code"
          echo "Response:"
          cat response.json

          if [ "$http_code" != "201" ]; then
            echo "Render deployment failed."
            exit 1
          fi

      - name: Show deployment information
        run: echo "Deployment triggered successfully."
