# ==============================================
# CONFIGURACIÓN PARA PRUEBAS UNITARIAS E INTEGRACIÓN
# ==============================================
# Este archivo sobrescribe application.properties durante las pruebas
# Base de datos H2 en memoria para pruebas aisladas

spring.application.name=FinanceTracker-test

# ==============================================
# BASE DE DATOS H2 (en memoria)
# ==============================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==============================================
# JPA / HIBERNATE
# ==============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================
# JWT CONFIGURACIÓN (valores fijos para pruebas)
# ==============================================
jwt.secret=0123456789012345678901234567890123456789012345678901234567890123
jwt.expiration=60000
jwt.refresh-expiration=120000

# ==============================================
# GOOGLE OAUTH2 (valores mock para pruebas)
# ==============================================
spring.security.oauth2.client.registration.google.client-id=mock-client-id.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=mock-secret

# ==============================================
# LOGGING
# ==============================================
logging.level.com.udea.FinanceTracker=DEBUG
logging.level.org.springframework.test=INFO